name: Web2APK

# Nama run unik per build agar bot bisa match runId dengan benar (cegah tukar APK)
run-name: web2apk-${{ inputs.tag || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'Icon Url'
        required: true
      tag:
        description: 'Tag unik build (cegah tukar APK concurrent)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable
          cache: true
          cache-key: flutter-3.32.4-web2apk-v2

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: web2apk-pub-flutter-3.32.4-v2
          restore-keys: |
            web2apk-pub-flutter-3.32.4-

      - name: Create Flutter Project
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          PKG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr -cd '[:alnum:]_')
          flutter create --org com.webapk --project-name "$PKG" myapp

      - name: Add Assets and Dependencies
        run: |
          set -e
          cd myapp
          mkdir -p assets/icon
          # Tulis dependency sekali ke pubspec, lalu 1x pub get (bukan 3x flutter pub add)
          if ! grep -q 'webview_flutter:' pubspec.yaml; then
            # Sisipkan setelah baris dependencies:
            awk '
              BEGIN{done=0}
              {
                print
                if (!done && $0 ~ /^dependencies:/) {
                  print "  webview_flutter: any"
                  print "  flutter_launcher_icons: any"
                  print "  connectivity_plus: any"
                  done=1
                }
              }
            ' pubspec.yaml > pubspec.yaml.tmp && mv pubspec.yaml.tmp pubspec.yaml
          fi
          if ! grep -q 'assets/icon' pubspec.yaml; then
            printf '\n  assets:\n    - assets/icon/\n' >> pubspec.yaml
          fi
          flutter pub get --no-example 2>&1 | tail -8


      - name: Write main.dart
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          WEB_URL="${{ github.event.inputs.web_url }}"

          cat > myapp/lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'dart:async';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.dark,
            ));
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: r'$APP_NAME',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, primarySwatch: Colors.blue),
                home: const SplashScreen(),
              );
            }
          }

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen>
              with TickerProviderStateMixin {
            late AnimationController _fadeController;
            late AnimationController _scaleController;
            late AnimationController _dotController;
            late Animation<double> _fadeAnim;
            late Animation<double> _scaleAnim;
            late Animation<double> _dot1Anim;
            late Animation<double> _dot2Anim;
            late Animation<double> _dot3Anim;
            
            bool _isChecking = false;
            bool _dialogShown = false;

            @override
            void initState() {
              super.initState();

              _fadeController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 800),
              );
              _scaleController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 800),
              );
              _dotController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1200),
              )..repeat();

              _fadeAnim = Tween<double>(begin: 0.0, end: 1.0).animate(
                CurvedAnimation(parent: _fadeController, curve: Curves.easeOut),
              );
              _scaleAnim = Tween<double>(begin: 0.75, end: 1.0).animate(
                CurvedAnimation(parent: _scaleController, curve: Curves.easeOutBack),
              );

              _dot1Anim = TweenSequence([
                TweenSequenceItem(tween: Tween<double>(begin: 0.3, end: 1.0), weight: 1),
                TweenSequenceItem(tween: Tween<double>(begin: 1.0, end: 0.3), weight: 1),
                TweenSequenceItem(tween: ConstantTween<double>(0.3), weight: 1),
              ]).animate(CurvedAnimation(parent: _dotController, curve: Curves.easeInOut));

              _dot2Anim = TweenSequence([
                TweenSequenceItem(tween: ConstantTween<double>(0.3), weight: 1),
                TweenSequenceItem(tween: Tween<double>(begin: 0.3, end: 1.0), weight: 1),
                TweenSequenceItem(tween: Tween<double>(begin: 1.0, end: 0.3), weight: 1),
              ]).animate(CurvedAnimation(parent: _dotController, curve: Curves.easeInOut));

              _dot3Anim = TweenSequence([
                TweenSequenceItem(tween: Tween<double>(begin: 1.0, end: 0.3), weight: 1),
                TweenSequenceItem(tween: ConstantTween<double>(0.3), weight: 1),
                TweenSequenceItem(tween: Tween<double>(begin: 0.3, end: 1.0), weight: 1),
              ]).animate(CurvedAnimation(parent: _dotController, curve: Curves.easeInOut));

              _fadeController.forward();
              _scaleController.forward();

              Timer(const Duration(milliseconds: 1500), () {
                _checkConnectionAndNavigate();
              });
            }

            Future<void> _checkConnectionAndNavigate() async {
              if (_isChecking) return;
              setState(() {
                _isChecking = true;
              });

              await Future.delayed(const Duration(milliseconds: 1000));

              var connectivityResult = await (Connectivity().checkConnectivity());
              if (connectivityResult.every((r) => r == ConnectivityResult.none)) {
                setState(() {
                  _isChecking = false;
                });
                _showNoConnectionDialog();
              } else {
                if (mounted) {
                  Navigator.pushReplacement(
                    context,
                    PageRouteBuilder(
                      transitionDuration: const Duration(milliseconds: 500),
                      pageBuilder: (_, __, ___) => const WebViewPage(),
                      transitionsBuilder: (_, anim, __, child) =>
                          FadeTransition(opacity: anim, child: child),
                    ),
                  );
                }
              }
            }

            void _showNoConnectionDialog() {
              if (!mounted || _dialogShown) return;
              setState(() {
                _dialogShown = true;
              });
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (context) => AlertDialog(
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                  title: const Row(
                    children: [
                      Icon(Icons.wifi_off, color: Colors.red),
                      SizedBox(width: 8),
                      Text('Gagal Terhubung'),
                    ],
                  ),
                  content: const Text(
                    'Tidak ada koneksi internet. Periksa jaringan kamu dan coba lagi.',
                  ),
                  actions: [
                    TextButton(
                      onPressed: () {
                        Navigator.pop(context);
                        setState(() {
                          _dialogShown = false;
                        });
                        _checkConnectionAndNavigate();
                      },
                      child: const Text('Coba Lagi'),
                    ),
                  ],
                ),
              );
            }

            @override
            void dispose() {
              _fadeController.dispose();
              _scaleController.dispose();
              _dotController.dispose();
              super.dispose();
            }

            Widget _buildDot(Animation<double> anim, Color color) {
              return AnimatedBuilder(
                animation: anim,
                builder: (_, __) => Opacity(
                  opacity: anim.value,
                  child: Container(
                    width: 8,
                    height: 8,
                    decoration: BoxDecoration(color: color, shape: BoxShape.circle),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final size = MediaQuery.of(context).size;
              return Scaffold(
                body: Container(
                  width: size.width,
                  height: size.height,
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                      colors: [Color(0xFFf0f4ff), Color(0xFFe8f5e9)],
                    ),
                  ),
                  child: FadeTransition(
                    opacity: _fadeAnim,
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Spacer(flex: 3),
                        ScaleTransition(
                          scale: _scaleAnim,
                          child: Container(
                            width: 140,
                            height: 140,
                            decoration: BoxDecoration(
                              borderRadius: BorderRadius.circular(32),
                              boxShadow: [
                                BoxShadow(
                                  color: Colors.black.withOpacity(0.15),
                                  blurRadius: 30,
                                  offset: const Offset(0, 10),
                                ),
                              ],
                            ),
                            child: ClipRRect(
                              borderRadius: BorderRadius.circular(32),
                              child: Image.asset(
                                'assets/icon/icon.png',
                                fit: BoxFit.cover,
                                errorBuilder: (_, __, ___) =>
                                    const Icon(Icons.android, size: 80, color: Colors.green),
                              ),
                            ),
                          ),
                        ),
                        const SizedBox(height: 28),
                        Text(
                          r'$APP_NAME',
                          style: const TextStyle(
                            fontSize: 26,
                            fontWeight: FontWeight.w700,
                            color: Color(0xFF1a1a2e),
                            letterSpacing: 0.5,
                          ),
                        ),
                        const Spacer(flex: 3),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            _buildDot(_dot1Anim, const Color(0xFF4A90E2)),
                            const SizedBox(width: 8),
                            _buildDot(_dot2Anim, const Color(0xFF4A90E2)),
                            const SizedBox(width: 8),
                            _buildDot(_dot3Anim, const Color(0xFF4A90E2)),
                          ],
                        ),
                        const SizedBox(height: 48),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;
            late final Connectivity _connectivity;
            StreamSubscription<List<ConnectivityResult>>? _connectivitySub;
            bool _dialogShown = false;

            @override
            void initState() {
              super.initState();
              _connectivity = Connectivity();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(Colors.white)
                ..setNavigationDelegate(NavigationDelegate(
                  onWebResourceError: (error) {
                    if (error.isForMainFrame == true) _showNoConnectionDialog();
                  },
                ))
                ..loadRequest(Uri.parse(r'$WEB_URL'));

              _connectivitySub = _connectivity.onConnectivityChanged.listen((results) {
                if (results.every((r) => r == ConnectivityResult.none)) {
                  _showNoConnectionDialog();
                }
              });
            }

            @override
            void dispose() {
              _connectivitySub?.cancel();
              super.dispose();
            }

            void _showNoConnectionDialog() {
              if (!mounted || _dialogShown) return;
              setState(() {
                _dialogShown = true;
              });
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (context) => AlertDialog(
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                  title: const Row(
                    children: [
                      Icon(Icons.wifi_off, color: Colors.red),
                      SizedBox(width: 8),
                      Text('Gagal Terhubung'),
                    ],
                  ),
                  content: const Text(
                    'Tidak ada koneksi internet. Periksa jaringan kamu dan coba lagi.',
                  ),
                  actions: [
                    TextButton(
                      onPressed: () {
                        Navigator.pop(context);
                        setState(() {
                          _dialogShown = false;
                        });
                        _controller.reload();
                      },
                      child: const Text('Coba Lagi'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvoked: (didPop) async {
                  if (didPop) return;
                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                  } else {
                    SystemNavigator.pop();
                  }
                },
                child: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(controller: _controller),
                  ),
                ),
              );
            }
          }
          DART

          # Mengubah pembatas slash (/) menjadi pagar (#) agar link HTTP tidak merusak regex sed
          sed -i "s#r'\$APP_NAME'#'$APP_NAME'#g" myapp/lib/main.dart
          sed -i "s#r'\$WEB_URL'#'$WEB_URL'#g" myapp/lib/main.dart

      - name: Fix Android Permissions and App Name
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          MANIFEST="myapp/android/app/src/main/AndroidManifest.xml"
          
          sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.INTERNET"\/>' $MANIFEST
          sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' $MANIFEST
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" $MANIFEST

      - name: Setup Network Security (Allow HTTP)
        run: |
          mkdir -p myapp/android/app/src/main/res/xml
          cat > myapp/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors>
                <certificates src="system"/>
              </trust-anchors>
            </base-config>
          </network-security-config>
          EOF
          
          sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' \
            myapp/android/app/src/main/AndroidManifest.xml

      - name: Download and Sanitize Icon
        run: |
          mkdir -p myapp/assets/icon
          # Gunakan ImageMagick yang tersedia di runner; install hanya bila belum ada.
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.icon_url }}" \
            -o myapp/assets/icon/icon_raw

          # Mengubah gambar menjadi format PNG 1024x1024 yang valid
          convert myapp/assets/icon/icon_raw \
            -background transparent \
            -gravity center \
            -resize 1024x1024 \
            -extent 1024x1024 \
            myapp/assets/icon/icon.png

      - name: Write launcher icons config
        run: |
          cat > myapp/flutter_launcher_icons.yaml << 'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            min_sdk_android: 21
          EOF

      - name: Generate Icons
        run: |
          cd myapp
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Configure Gradle speed
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          org.gradle.configuration-cache.problems=warn
          org.gradle.configureondemand=true
          org.gradle.daemon=true
          org.gradle.workers.max=4
          org.gradle.vfs.watch=false
          kotlin.incremental=true
          kotlin.compiler.execution.strategy=in-process
          android.useAndroidX=true
          android.enableJetifier=false
          android.enableR8.fullMode=false
          android.nonTransitiveRClass=true
          android.nonFinalResIds=true
          EOF
          # Inject ke project juga
          if [ -d myapp/android ]; then
            touch myapp/android/gradle.properties
            grep -q 'org.gradle.parallel' myapp/android/gradle.properties || echo 'org.gradle.parallel=true' >> myapp/android/gradle.properties
            grep -q 'org.gradle.caching' myapp/android/gradle.properties || echo 'org.gradle.caching=true' >> myapp/android/gradle.properties
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/native
          key: web2apk-gradle-android-35-v4
          restore-keys: |
            web2apk-gradle-android-35-

      - name: Build APK
        run: |
          cd myapp
          # SPEED MODE: arm64 saja agar hanya satu ABI dikompilasi.
          flutter build apk --release --no-pub --suppress-analytics \
            --target-platform=android-arm64 \
            --no-tree-shake-icons

      - name: Upload APK Direct ke Release
        env:
          BUILD_TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APK: myapp/build/app/outputs/flutter-apk/app-release.apk
        run: |
          set -e
          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            -o /tmp/web2apk_releases.json
          UPLOAD_URL=$(python3 -c 'import json,sys; tag=sys.argv[2]; d=json.load(open(sys.argv[1])); r=next((x for x in d if x.get("tag_name")==tag),None); print((r or {}).get("upload_url","").split("{",1)[0]); sys.exit(0 if r else 1)' /tmp/web2apk_releases.json "$BUILD_TAG")
          [ -n "$UPLOAD_URL" ] || { echo "upload_url release draft/tag belum ditemukan: $BUILD_TAG"; exit 1; }
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "${UPLOAD_URL}?name=app-release.apk" \
            >/tmp/web2apk_upload.json
          echo "Release APK upload selesai: $(stat -c%s "$APK") bytes"

