name: Build Flutter APK

run-name: flutter-${{ inputs.build_type || 'release' }}-${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release / native"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    # Pin runner image agar versi Java default ubuntu-latest tidak berubah diam-diam.
    runs-on: ubuntu-24.04
    # Target warm-cache: sekitar 3 menit setelah runner tersedia. Runner queue/network tetap di luar kontrol workflow.
    timeout-minutes: 10
    env:
      # Runner GitHub berjalan sebagai /home/runner, bukan root; cache di home benar-benar bisa dipakai.
      PUB_CACHE: /home/runner/.pub-cache
      GRADLE_USER_HOME: /home/runner/.gradle
      # Kurangi noise & overhead Flutter tooling
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      CI: "true"

    steps:
      # ── 1) Cache (wajib step terpisah) ─────────────────────────────────────
      - name: Cache Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/flutter
          key: flutter-sdk-3.32.4-home-v2
          restore-keys: |
            flutter-sdk-3.32.4-home-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: /home/runner/.pub-cache
          key: pub-flutter-3.32.4-home-v2
          restore-keys: |
            pub-flutter-3.32.4-home-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper
            /home/runner/.gradle/native
          key: gradle-android-35-home-v2
          restore-keys: |
            gradle-android-35-home-

      # ── 2) Flutter install (hanya cache miss) ──────────────────────────────
      - name: Install Flutter (cache miss only)
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 2 --connect-timeout 8 --max-time 90 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.32.4-stable.tar.xz \
            | tar -xJ -C /home/runner
          /home/runner/flutter/bin/flutter config --no-analytics --no-cli-animations >/dev/null 2>&1 || true
          /home/runner/flutter/bin/flutter precache --android --no-ios --no-web --no-linux --no-windows --no-macos >/dev/null 2>&1 || true

      # Pin JDK 17 secara eksplisit. Runner ubuntu-latest terbaru dapat memakai Java 25,
      # sedangkan sejumlah Gradle/Kotlin plugin proyek Flutter belum kompatibel dengannya.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3) SATU STEP BESAR: setup + download + deps + build + locate ───────
      # Menggabungkan step mengurangi overhead GitHub Actions (~3–8s per step)
      - name: Setup + Build APK
        id: build
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          ONLY_ANALYZE: ${{ github.event.inputs.only_analyze }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          T0=$(date +%s)
          now() { echo $(( $(date +%s) - T0 )); }
          echo "[00s] Runner started"

          # Gunakan JDK 17 dari actions/setup-java; jangan mengambil Java default runner.
          if [ -n "${JAVA_HOME_17_X64:-}" ] && [ -d "$JAVA_HOME_17_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
          fi
          if [ -z "${JAVA_HOME:-}" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "::error::JDK 17 tidak ditemukan setelah setup-java"
            exit 1
          fi
          export PATH="$JAVA_HOME/bin:/home/runner/flutter/bin:$PATH"
          # Persist and pin JDK 17 for Flutter and every Gradle subprocess.
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          flutter config --jdk-dir="$JAVA_HOME" >/dev/null
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "Gradle JDK pin: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '[\".]' '/version/ {print $2; exit}')
          [ "$JAVA_MAJOR" = "17" ] || { echo "::error::Build wajib memakai Java 17, terdeteksi Java $JAVA_MAJOR"; exit 1; }
          flutter config --no-analytics --no-cli-animations >/dev/null 2>&1 || true
          # Android SDK path (cache-friendly)
          for SDK_CAND in /usr/local/lib/android/sdk /home/runner/Android/Sdk /opt/android-sdk; do
            if [ -d "$SDK_CAND" ]; then
              export ANDROID_HOME="$SDK_CAND"
              export ANDROID_SDK_ROOT="$SDK_CAND"
              break
            fi
          done
          if [ -n "${ANDROID_HOME:-}" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
            flutter config --android-sdk "$ANDROID_HOME" >/dev/null 2>&1 || true
          fi
          # Licenses: cepat jika sudah di-cache; jangan blok lama
          yes 2>/dev/null | flutter doctor --android-licenses >/dev/null 2>&1 || true
          echo "[$(now)s] Flutter ready"

          # Gradle global (daemon + cache + parallel)
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" << GPEOF
          org.gradle.java.home=$JAVA_HOME
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseContainerSupport
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=true
          org.gradle.configuration-cache=true
          org.gradle.configuration-cache.problems=warn
          org.gradle.configureondemand=true
          org.gradle.workers.max=4
          org.gradle.vfs.watch=false
          kotlin.incremental=true
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental.useClasspathSnapshot=true
          android.enableR8.fullMode=false
          android.enableBuildCache=true
          android.useAndroidX=true
          android.enableJetifier=false
          android.defaults.buildfeatures.buildconfig=false
          android.defaults.buildfeatures.aidl=false
          android.defaults.buildfeatures.renderscript=false
          android.defaults.buildfeatures.shaders=false
          android.nonTransitiveRClass=true
          android.nonFinalResIds=true
          GPEOF

          # Download + extract project
          HTTP_CODE=$(curl -fsSL --retry 2 --retry-delay 0 --connect-timeout 8 --max-time 60 --compressed \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: FlutterBuildBot/3.0.0" \
            "${ZIP_URL}" -o project.zip -w "%{http_code}")
          echo "HTTP $HTTP_CODE | $(ls -lh project.zip | awk '{print $5}')"
          [ "$HTTP_CODE" != "200" ] && echo "Download gagal" && exit 1
          unzip -q project.zip -d project_raw && rm -f project.zip
          S=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          F=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          if [ "$S" = "1" ] && [ "$F" = "0" ]; then
            mv "$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -1)" project
          else
            mv project_raw project
          fi
          rm -rf project_raw 2>/dev/null || true
          PROJECT_DIR="$GITHUB_WORKSPACE/project"
          cd "$PROJECT_DIR"
          echo "[$(now)s] Project ready"

          # Tune project gradle.properties (tanpa clean)
          find . -name "gradle.properties" -type f 2>/dev/null | while read -r GP; do
            touch "$GP"
            grep -q 'org.gradle.parallel' "$GP" 2>/dev/null || echo 'org.gradle.parallel=true' >> "$GP"
            grep -q 'org.gradle.caching' "$GP" 2>/dev/null || echo 'org.gradle.caching=true' >> "$GP"
            grep -q 'org.gradle.jvmargs' "$GP" 2>/dev/null || echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC' >> "$GP"
            grep -q 'android.enableR8.fullMode' "$GP" 2>/dev/null || echo 'android.enableR8.fullMode=false' >> "$GP"
            grep -q 'kotlin.incremental' "$GP" 2>/dev/null || echo 'kotlin.incremental=true' >> "$GP"
          done

          # Opsional: minifyEnabled false di release jika project mengaktifkan R8 berat
          # (hanya soft-tune; tidak mengubah signing / applicationId)
          if [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ]; then
            for BG in android/app/build.gradle android/app/build.gradle.kts; do
              [ -f "$BG" ] || continue
              # Pastikan shrink resources tidak memicu full R8 lambat di CI
              # Kotlin DSL (.kts) butuh 'isShrinkResources = false'; Groovy pakai 'shrinkResources false'.
              case "$BG" in
                *.kts) sed -i -E 's/([iI]s)?[sS]hrinkResources[[:space:]]*=?[[:space:]]*true/isShrinkResources = false/g' "$BG" 2>/dev/null || true ;;
                *)     sed -i -E 's/shrinkResources[[:space:]]*=?[[:space:]]*true/shrinkResources false/g' "$BG" 2>/dev/null || true ;;
              esac
            done
          fi

          if [ "$ONLY_ANALYZE" = "true" ]; then
            [ -f pubspec.yaml ] && flutter pub get --no-example 2>&1 | tail -3
            [ -f pubspec.yaml ] && flutter analyze 2>&1 | tail -20
            exit 1
          fi

          # Dependencies — 1x saja, offline dulu
          if [ -f pubspec.yaml ]; then
            flutter pub get --no-example --offline 2>/dev/null \
              || flutter pub get --no-example 2>&1 | tail -6
          fi
          echo "[$(now)s] Dependencies ready"

          BT="$BUILD_TYPE"
          [ "$BT" = "native" ] && BT="release"
          echo "[$(now)s] Gradle build started (type=$BUILD_TYPE)"

          # Paksa Gradle (yang dipanggil Flutter) memakai JDK 17 di level PROJECT: properti project mengalahkan
          # ~/.gradle/gradle.properties, jadi tanpa ini Gradle bisa tetap memakai Java 25 dari runner.
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          if [ -d "$PROJECT_DIR/android" ]; then
            touch "$PROJECT_DIR/android/gradle.properties"
            sed -i '/^org\.gradle\.java\.home=/d' "$PROJECT_DIR/android/gradle.properties"
            echo "org.gradle.java.home=$JAVA_HOME" >> "$PROJECT_DIR/android/gradle.properties"
          fi
          echo "Gradle akan memakai: $JAVA_HOME"; "$JAVA_HOME/bin/java" -version 2>&1 | head -1
          if [ -f pubspec.yaml ] && [ "$BUILD_TYPE" != "native" ]; then
            # SPEED MODE: arm64 saja = satu target ABI, sehingga waktu compile + ukuran APK turun.
            # Untuk APK universal arm32+arm64, ubah target-platform kembali di project bila memang diperlukan.
            if [ "$BT" = "release" ]; then
              flutter build apk --release --no-pub --suppress-analytics \
                --target-platform=android-arm64 \
                --no-tree-shake-icons
            else
              flutter build apk --debug --no-pub --suppress-analytics \
                --target-platform=android-arm64
            fi
          else
            GRADLE_PATH=$(find . -name gradlew -type f -print -quit)
            [ -z "$GRADLE_PATH" ] && echo "gradlew tidak ditemukan!" && exit 1
            chmod +x "$GRADLE_PATH"
            (
              cd "$(dirname "$GRADLE_PATH")"
              echo "JAVA_HOME=$JAVA_HOME"; ./gradlew --version 2>/dev/null | grep -i "JVM" || true
              if [ "$BT" = "debug" ]; then
                ./gradlew assembleDebug --parallel --build-cache --configuration-cache \
                  || ./gradlew assembleDebug --parallel --build-cache
              else
                ./gradlew assembleRelease --parallel --build-cache --configuration-cache \
                  || ./gradlew assembleRelease --parallel --build-cache
              fi
            )
          fi
          echo "[$(now)s] APK build completed"

          # Locate APK — path standar dulu
          CANDIDATES=(
            "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
            "$PROJECT_DIR/build/app/outputs/flutter-apk/app-debug.apk"
            "$PROJECT_DIR/build/app/outputs/apk/release/app-release.apk"
            "$PROJECT_DIR/build/app/outputs/apk/debug/app-debug.apk"
            "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          )
          APK=""
          for p in "${CANDIDATES[@]}"; do
            [ -f "$p" ] && APK="$p" && break
          done
          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR" \( -name "app-release.apk" -o -name "app-debug.apk" \) -type f -print -quit 2>/dev/null || true)
          fi
          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR" -name "*.apk" -type f ! -name "*unaligned*" -print -quit 2>/dev/null || true)
          fi
          [ -z "$APK" ] && echo "APK tidak ditemukan!" && exit 1
          echo "APK: $(ls -lh "$APK" | awk '{print $5, $9}')"
          ln -f "$APK" "$GITHUB_WORKSPACE/output.apk" 2>/dev/null || cp -f "$APK" "$GITHUB_WORKSPACE/output.apk"

          TOTAL=$(( $(date +%s) - T0 ))
          echo "[${TOTAL}s] Build pipeline done"
          if [ "$TOTAL" -gt 60 ]; then
            echo "::warning::Warm-path target 60s terlewati (${TOTAL}s). Queue/cache GitHub dapat menambah overhead; cek log timing di atas."
          fi

          # Upload APK mentah ke Release yang sudah dibuat bot.
          # Ini lebih cepat daripada upload-artifact (ZIP) karena bot bisa download APK langsung.
          BUILD_TAG="${{ github.event.inputs.tag }}"
          APK_NAME="$(basename "$APK")"
          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            -o /tmp/releases.json
          UPLOAD_URL=$(python3 -c 'import json,sys; tag=sys.argv[2]; d=json.load(open(sys.argv[1])); r=next((x for x in d if x.get("tag_name")==tag),None); print((r or {}).get("upload_url","").split("{",1)[0]); sys.exit(0 if r else 1)' /tmp/releases.json "$BUILD_TAG")
          [ -n "$UPLOAD_URL" ] || { echo "upload_url release draft/tag belum ditemukan: $BUILD_TAG"; exit 1; }
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "${UPLOAD_URL}?name=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$APK_NAME")" \
            >/tmp/apk_upload.json
          echo "Release APK upload selesai: $(stat -c%s "$APK") bytes"
